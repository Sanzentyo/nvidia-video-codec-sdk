[workspace]
resolver = "2"

[package]
name = "nvidia-video-codec-sdk"
version = "0.4.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

description = "Bindings for NVIDIA Video Codec SDK"
homepage = "https://github.com/ViliamVadocz/nvidia-video-codec-sdk"
documentation = "https://docs.rs/nvidia-video-codec-sdk"
repository = "https://github.com/ViliamVadocz/nvidia-video-codec-sdk"
readme = "README.md"

keywords = ["encoding", "decoding", "bindings", "nvidia", "cuda"]

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
features = ["ci-check"]

[dependencies]
cudarc = { version = "=0.19.2", optional = true, features = ["cuda-version-from-build-system"] }
image = { version = "0.25.9", optional = true }
anyhow = { version = "1.0.101", optional = true }
serde_json = { version = "1.0.149", optional = true }
libloading = { version = "0.9", optional = true }
thiserror = "2.0.18"

[dev-dependencies]
vulkano = "0.35.2"
libc = "0.2.182"
memmap2 = "0.9.10"
eframe = "0.33.3"

# parse nal unit(h265/hevc)
scuffle-h265 = "0.2.2"

# mp4 muxing/demuxing
shiguredo_mp4 = "2026.1.0"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter"] }
serde = { version = "1.0.228", features = ["derive"] }
rtc = "0.9.0"
bytes = "1.11.1"

[target.'cfg(windows)'.dependencies]
ash = { version = "0.38.0", optional = true, default-features = false, features = ["loaded"] }
windows = { version = "0.62.2", optional = true, features = ["Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common"] }

[features]
default = ["cuda"]
cuda = ["dep:cudarc", "dep:image", "dep:anyhow", "dep:serde_json", "dep:ash"]
runtime-nvenc = ["dep:libloading"]
d3d12 = ["runtime-nvenc", "dep:windows"]
# workaround to make the ci similar to cudarc
ci-check = ["cuda", "cudarc/cuda-12020", "cudarc/dynamic-loading"]
